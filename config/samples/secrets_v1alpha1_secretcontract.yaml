apiVersion: secrets.platform.io/v1alpha1
kind: SecretContract
metadata:
  labels:
    app.kubernetes.io/name: secret-contract-operator
    app.kubernetes.io/managed-by: kustomize
  name: webapp-database
spec:
  secretRef:
    name: webapp-database
  requiredKeys:
    - name: DATABASE_URL
      required: true
      nonEmpty: true
      minLength: 12
      format: URI
    - name: DB_USERNAME
      required: true
      nonEmpty: true
      minLength: 3
      pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
    - name: DB_PASSWORD
      required: true
      nonEmpty: true
      minLength: 16
    - name: DB_OPTIONS_JSON
      required: false
      nonEmpty: false
      format: JSON
  externalSecretRef:
    name: webapp-database
  workloadRefs:
    - kind: Deployment
      name: webapp
  injection:
    enabled: true
    mode: EnvVars
    managed: false
  rotation:
    restartOnChange: false
    maxAge: 720h
  policy:
    failIfSecretMissing: true
    failIfKeyEmpty: true
    requireExternalSecretReady: false
    requireWorkloadReference: false
