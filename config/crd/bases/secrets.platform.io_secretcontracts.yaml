---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: secretcontracts.secrets.platform.io
spec:
  group: secrets.platform.io
  names:
    kind: SecretContract
    listKind: SecretContractList
    plural: secretcontracts
    shortNames:
    - scn
    singular: secretcontract
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.secretName
      name: Secret
      type: string
    - jsonPath: .status.missingKeys
      name: MissingKeys
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SecretContract is the Schema for the secretcontracts API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SecretContract
            properties:
              externalSecretRef:
                description: |-
                  externalSecretRef optionally references an ExternalSecret-like object to check for readiness.
                  The operator uses unstructured objects for this integration and does not import provider APIs.
                properties:
                  apiVersion:
                    default: external-secrets.io/v1
                    description: apiVersion is the API version of the ExternalSecret-like
                      object.
                    type: string
                  kind:
                    default: ExternalSecret
                    description: kind is the kind of the ExternalSecret-like object.
                    type: string
                  name:
                    description: name is the ExternalSecret-like object name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              injection:
                description: |-
                  injection configures optional workload reference validation or mutation.
                  Validation-only behavior is the default.
                properties:
                  containerName:
                    description: containerName scopes validation or mutation to one
                      container. If empty, all containers are checked.
                    type: string
                  enabled:
                    default: false
                    description: enabled controls whether workload injection checks
                      are enabled.
                    type: boolean
                  managed:
                    default: false
                    description: |-
                      managed controls whether the operator may patch workload env or envFrom references.
                      If false, behavior is validation-only.
                    type: boolean
                  mode:
                    default: None
                    description: mode is the expected workload Secret reference mode.
                    enum:
                    - None
                    - EnvFrom
                    - EnvVars
                    type: string
                type: object
              policy:
                description: policy configures high-level validation behavior.
                properties:
                  failIfKeyEmpty:
                    default: true
                    description: failIfKeyEmpty marks the contract invalid when a
                      required key has an empty value.
                    type: boolean
                  failIfSecretMissing:
                    default: true
                    description: failIfSecretMissing marks the contract invalid when
                      the referenced Secret does not exist.
                    type: boolean
                  requireExternalSecretReady:
                    default: false
                    description: requireExternalSecretReady marks the contract invalid
                      when externalSecretRef is not ready.
                    type: boolean
                  requireWorkloadReference:
                    default: false
                    description: requireWorkloadReference marks the contract invalid
                      when workload references are not configured.
                    type: boolean
                type: object
              requiredKeys:
                description: requiredKeys defines the Secret keys and rules this contract
                  validates.
                items:
                  description: SecretKeyRule defines validation rules for one Secret
                    key.
                  properties:
                    format:
                      default: None
                      description: format is an optional semantic value format check.
                      enum:
                      - None
                      - JSON
                      - URI
                      - PEM
                      type: string
                    maxLength:
                      description: maxLength is the maximum allowed value length in
                        bytes.
                      format: int32
                      minimum: 0
                      type: integer
                    minLength:
                      description: minLength is the minimum allowed value length in
                        bytes.
                      format: int32
                      minimum: 0
                      type: integer
                    name:
                      description: name is the Secret key name to validate.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[A-Za-z_][A-Za-z0-9_.-]*$
                      type: string
                    nonEmpty:
                      default: true
                      description: nonEmpty controls whether the key value must be
                        non-empty when present.
                      type: boolean
                    pattern:
                      description: pattern is an optional regular expression the value
                        must match.
                      type: string
                    required:
                      default: true
                      description: required controls whether the key must exist.
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              rotation:
                description: |-
                  rotation configures optional rotation checks and opt-in workload restarts.
                  Restart annotations must use Secret metadata such as resourceVersion, not Secret data hashes.
                properties:
                  maxAge:
                    description: maxAge is the maximum allowed age since the last
                      known rotation.
                    type: string
                  restartAnnotation:
                    default: secret-contract.io/secret-resource-version
                    description: |-
                      restartAnnotation is the workload pod-template annotation used for opt-in restarts.
                      The annotation value must be derived from Secret metadata such as resourceVersion, never Secret data.
                    type: string
                  restartOnChange:
                    default: false
                    description: restartOnChange controls whether referenced workloads
                      may be restarted when the Secret changes.
                    type: boolean
                  rotatedAtAnnotation:
                    default: secret-contract.io/rotated-at
                    description: rotatedAtAnnotation is the annotation used to read
                      or write rotation timestamps.
                    type: string
                type: object
              secretRef:
                description: |-
                  secretRef references the local Kubernetes Secret that must satisfy this contract.
                  The Secret must be in the same namespace as the SecretContract.
                properties:
                  name:
                    description: name is the local Kubernetes Secret name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              workloadRefs:
                description: workloadRefs optionally identifies workloads that should
                  reference this Secret.
                items:
                  description: WorkloadReference identifies a workload that should
                    reference the Secret.
                  properties:
                    apiVersion:
                      default: apps/v1
                      description: apiVersion is the workload API version.
                      type: string
                    kind:
                      default: Deployment
                      description: kind is the supported workload kind.
                      enum:
                      - Deployment
                      - StatefulSet
                      - DaemonSet
                      type: string
                    name:
                      description: name is the workload name.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - apiVersion
                - kind
                - name
                x-kubernetes-list-type: map
            required:
            - secretRef
            type: object
          status:
            description: status defines the observed state of SecretContract
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the SecretContract resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.
                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              externalSecretStatus:
                description: externalSecretStatus describes the optional ExternalSecret-like
                  object status.
                properties:
                  message:
                    description: message is a human-readable explanation. It must
                      never include Secret values.
                    type: string
                  name:
                    description: name is the ExternalSecret-like object name.
                    type: string
                  ready:
                    description: ready indicates whether the ExternalSecret-like object
                      is ready.
                    type: boolean
                  reason:
                    description: reason is a short machine-readable reason.
                    type: string
                required:
                - name
                - ready
                type: object
              lastCheckedTime:
                description: lastCheckedTime is when the controller last evaluated
                  this contract.
                format: date-time
                type: string
              missingKeys:
                description: missingKeys contains required key names that were not
                  present.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              secretName:
                description: secretName is the referenced Secret name observed by
                  the controller.
                type: string
              violations:
                description: violations describes contract validation failures. Secret
                  values must never be included.
                items:
                  description: SecretContractViolation describes a failed rule without
                    exposing Secret values.
                  properties:
                    key:
                      description: key is the Secret key name associated with the
                        violation.
                      type: string
                    message:
                      description: message is a human-readable explanation. It must
                        never include Secret values.
                      type: string
                    reason:
                      description: reason is a short machine-readable reason.
                      minLength: 1
                      type: string
                    rule:
                      description: rule is the rule that failed.
                      minLength: 1
                      type: string
                  required:
                  - reason
                  - rule
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              workloadStatuses:
                description: workloadStatuses describes referenced workload validation
                  state.
                items:
                  description: WorkloadContractStatus describes workload reference
                    validation without exposing Secret values.
                  properties:
                    apiVersion:
                      description: apiVersion is the workload API version.
                      type: string
                    configured:
                      description: configured indicates whether the workload references
                        the Secret as required.
                      type: boolean
                    kind:
                      description: kind is the workload kind.
                      enum:
                      - Deployment
                      - StatefulSet
                      - DaemonSet
                      type: string
                    message:
                      description: message is a human-readable explanation. It must
                        never include Secret values.
                      type: string
                    name:
                      description: name is the workload name.
                      type: string
                    reason:
                      description: reason is a short machine-readable reason.
                      type: string
                  required:
                  - apiVersion
                  - configured
                  - kind
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - apiVersion
                - kind
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
