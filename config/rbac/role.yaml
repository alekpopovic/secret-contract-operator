---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - secrets.platform.io
  resources:
  - secretcontracts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - secrets.platform.io
  resources:
  - secretcontracts/finalizers
  verbs:
  - update
- apiGroups:
  - secrets.platform.io
  resources:
  - secretcontracts/status
  verbs:
  - get
  - patch
  - update
